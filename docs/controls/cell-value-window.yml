id: cell-value-window
name: CellValueWindow
title: 칸 값 팝업
kind: window
source:
  - src/MyPlugin/Ui/CellValueWindow.cs
  - src/MyPlugin/Ui/SqlWorkspaceEdit.cs
  - src/MyPlugin/Ui/RowEditLogic.cs
  - src/MyPlugin/Db/DbSession.cs
  - src/MyPlugin/Db/ValueFormatter.cs
base: System.Windows.Window
used_by: [result-grid]
summary: >-
  결과 그리드 오른쪽 메뉴 [팝업으로 보기]로 여는 칸 값 하나의 창(모달 아님). 잘린 값(CLOB·BLOB 등)은 [전체 보기]로 DB에서
  1,000만 자(이진은 1,000만 바이트)씩 다시 읽고 [◀ 이전]·[다음 ▶]으로 쪽을 바꿔 보인다(화면에는 늘 한 쪽만).
features:
  - name: 머리
    description: 열 이름, 열 형식(고정폭). 창 제목에 행 번호.
  - name: 값
    description: >-
      읽기 전용 고정폭 글(줄 바꿈, 세로 스크롤, 선택·Ctrl+C 됨). 그리드 값 그대로(잘렸으면 "…(전체 n자)" 꼬리 포함).
      NULL은 빈 글과 안내 "NULL".
  - name: 전체 보기
    description: >-
      값이 잘렸을 때만 보인다. 빠른 조회(F1) 결과면 행을 찾는 키(기본 키 → NOT NULL 고유 키 → ROWID)의 원래 값으로
      그 열 하나를 SELECT해(RowEditLogic.SelectValueStatement, 동시성 비교 없음) 첫 쪽(ValueFormatter.PageLength)을 읽는다(DbSession.ReadValuePage → ValueFormatter.Page).
      직접 쓴 SQL 결과·키 없는 테이블·저장 전 새 행·ROWID를 모르는 행은 버튼을 끄고 이유를 툴팁과 안내 줄에 보인다(RowEditLogic.FullValueBlockReason).
  - name: 쪽 넘기기
    description: >-
      [다음 ▶]은 이 쪽 끝부터, [◀ 이전]은 앞 쪽 시작부터 다시 SELECT해 그 쪽으로 바꾼다(쌓지 않음). 쪽마다 위치를 안내 줄에
      "10,000,001–20,000,000 / 전체 25,000,000자"처럼 보인다. 글은 서로게이트 쌍을 쪽 경계에서 나누지 않는다. 이진은 16진수(첫 쪽만 0x).
      Oracle CLOB·BLOB는 LOB 위치를 옮겨 그 쪽만 읽는다.
  - name: 닫기
    description: "[닫기]·Esc. 읽는 중에 닫으면 읽기를 취소한다."
keyboard:
  - keys: Esc
    action: 닫기.
theme:
  - part: 창·값
    keys: [WindowBackground, PanelBackground, PrimaryText, SecondaryText]
states:
  - 잘린 값은 안내 줄에 "그리드에 있는 앞부분만 보입니다"와 [전체 보기] 가능 여부.
  - 읽는 동안 "DB에서 읽는 중…"(버튼 꺼짐). 읽은 뒤 "DB에서 다시 읽은 값 · 위치 / 전체 길이". 첫 쪽이면 [◀ 이전], 마지막 쪽이면 [다음 ▶]이 숨는다.
  - 쪽을 넘기는 사이 전체 길이가 바뀌면 ⚠ 경고(앞 쪽과 이어지지 않을 수 있음).
  - 실패(연결 없음·다른 작업 실행 중·행을 찾지 못함·DB 오류)는 안내 줄에 이유를 보이고 버튼을 다시 켠다.
limits:
  - 다시 읽은 값은 지금 DB 값이다. 조회한 뒤 다른 세션이 바꿨거나, 그리드에서 키를 고치고 저장하지 않았으면 그리드와 다를 수 있다(키는 원래 값으로 찾는다).
  - 같은 DB 세션을 다른 실행이 쓰는 중이면 기다리지 않고 실패로 알린다.
  - 쪽마다 따로 SELECT한다. 그 사이 값이 같은 길이로 바뀌면 알아채지 못한다(쪽끼리 다른 판의 값일 수 있음).
  - Oracle LOB는 그 쪽만 읽는다. PostgreSQL·SQL Server·SQLite는 공급자가 값을 통째로 읽은 뒤 자르므로 쪽을 넘길 때마다 값 전체를 다시 받고 그만큼 메모리를 쓴다.
  - PostgreSQL은 리더를 하나만 열 수 있어, 다시 읽으면 그 DB의 열린 결과 커서가 닫힌다([다음 행 가져오기] 꺼짐 — 트리 조회와 같음).
  - 한 쪽이 수 MB(특히 이진 16진수 — 1,000만 바이트면 2,000만 자)면 WPF TextBox 배치에 시간이 걸려 창이 잠시 멈출 수 있다.
  - 쪽을 넘어 찾기·전체 복사는 없다(파일 저장 없음). 화면 글은 그 쪽뿐이다.
verification:
  - 로직(쪽 나누기·서로게이트 경계·SELECT 문·막는 이유·SQLite 쪽 단위 다시 읽기)은 단위 테스트. 창 자체는 Linux에서 컴파일만 확인했고
    화면 확인·Oracle 실서버(CLOB·BLOB Position 이동 읽기) 확인은 하지 않았다.
tests:
  - tests/MyPlugin.Tests/ValueFormatterTests.cs
  - tests/MyPlugin.Tests/RowEditLogicTests.cs
  - tests/MyPlugin.Tests/DbSessionTests.cs
related: [result-grid, sql-workspace, result-edit-bar]
