id: query-settings-page
name: QuerySettingsPage
title: 설정 창 데이터 조회 탭
kind: settings-page
source:
  - src/MyPlugin/QuerySettingsPage.cs
  - src/MyPlugin/Db/QueryOptions.cs
base: Folderss.PluginContract.IPluginSettingsPage
summary: >-
  Folderss 설정 창의 "데이터 조회" 탭 — 트리 F1 빠른 조회 행 수와 Oracle FetchSize(바이트) 설정.
  저장하면 다음 조회부터 바로 적용된다.
features:
  - name: F1 빠른 조회 행 수
    description: >-
      트리 F1 빠른 조회 및 편집 막대 WHERE 다시 조회에서 처음 가져올 행 수(query-settings-rows — 1~10,000, 기본 100).
  - name: Oracle FetchSize
    description: >-
      Oracle ODP.NET FetchSize 바이트 크기(query-settings-fetch-bytes — 8,192~67,108,864, 기본 131,072 = 128KB).
  - name: 저장 및 유효성 검사
    description: >-
      설정 창 [저장] 시 범위 유효성을 검사하여 잘못된 값은 예외를 던지고, 성공 시 플러그인 설정 및 QueryOptions에 즉시 반영한다.
theme:
  - part: 레이블·보조 설명
    keys: [PrimaryText, SecondaryText]
limits:
  - FetchSize는 Oracle 데이터베이스 연결 조회에만 적용된다.
tests:
  - tests/MyPlugin.Tests/QueryOptionsTests.cs
related: [sql-workspace, result-edit-bar, db-tree-panel]
