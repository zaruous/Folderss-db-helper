id: result-edit-bar
name: SqlWorkspace (편집 막대)
title: 결과 편집 막대
kind: control
source:
  - src/MyPlugin/Ui/SqlWorkspaceEdit.cs
  - src/MyPlugin/Ui/RowEditLogic.cs
  - src/MyPlugin/Doc/ResultExcel.cs
  - src/MyPlugin/Db/DbSession.cs
  - src/MyPlugin/Db/Providers/IDbProvider.cs
base: System.Windows.Controls.Border (DockPanel)
used_by: [sql-workspace]
summary: >-
  빠른 조회(트리 F1) 결과 위에만 보이는 [행 추가]·[복제]·[편집]·[삭제] │ [저장] │ WHERE 칸·[다시 조회] │ 엑셀 연동 막대.
  고친 행은 UPDATE, 삭제 표시한 행은 DELETE로 행을 찾는 키(기본 키 → NOT NULL 고유 키 → Oracle ROWID)를 써서 DB에 보낸다(커밋 전).
  WHERE 칸의 조건으로 같은 테이블을 다시 조회해 앞 100행 밖의 행도 편집한다.
features:
  - name: 버튼 순서
    description: >-
      행을 바꾸는 버튼(행 추가 → 복제 → 편집 → 삭제), 간격을 두고 DB에 보내는 [저장], 간격을 두고 WHERE 칸·[다시 조회], 오른쪽에 엑셀 버튼(내보내기·템플릿·임포트).
  - name: 행 추가
    description: >-
      빈 새 행을 행 편집 창(새 행 모드)에서 채워 결과 끝에 붙인다(초록 바탕·＋). 취소하거나 값이 하나도 없으면 만들지 않는다.
  - name: 복제
    description: >-
      고른 행(여럿이면 번호가 가장 작은 행)의 값으로 편집 창을 먼저 연다(기본 키를 바꾸게). LOB 같은 편집할 수 없는 형식과
      잘려 보이는 값은 원래 값을 몰라 NULL로 비운다.
  - name: 편집
    description: >-
      고른 행(여럿이면 번호가 가장 작은 행)을 행 편집 창에서 고친다. 삭제 표시한 행은 먼저 표시를 풀어야 한다.
      저장 전 새 행은 새 행 모드로 열린다.
  - name: 삭제
    description: >-
      고른 행에 삭제 표시를 한다. 고른 행이 모두 삭제 표시면 표시를 푼다.
      저장 전 새 행은 DB에 없으므로 표시하지 않고 바로 뺀다.
  - name: 저장
    description: >-
      확인 창에 실행할 문장을 보인 뒤 DELETE → UPDATE → INSERT 순으로 행마다 하나씩 실행한다
      (지운 행과 같은 키로 새 행을 넣어도 겹치지 않게). UPDATE는 바뀐 열만 SET,
      DELETE·UPDATE의 WHERE는 키(기본 키·고유 키)의 원래 값 또는 ROWID이고 값은 바인드 변수로 보낸다(Oracle·PostgreSQL ':', SQL Server '@').
      INSERT는 NULL(빈 칸)인 열과 LOB 같은 편집할 수 없는 형식의 열을 빼서 DB 기본값·자동 번호가 들어가게 한다.
      실행한 변경은 편집기 DML과 같이 커밋 대기로 센다.
  - name: 엑셀 연동
    description: >-
      [엑셀 내보내기]로 조회된 행을 .xlsx 파일로 저장하고, [엑셀 템플릿]으로 컬럼 헤더만 있는 빈 서식을 생성하며,
      [엑셀 임포트]로 엑셀 데이터를 읽어 새 행(INSERT 예정)으로 한 번에 추가한다.
  - name: INSERT 문 만들기(오른쪽 메뉴)
    description: >-
      빠른 조회(F1, 테이블 하나) 결과에서 행을 고르고 오른쪽 메뉴 → 고른 행(화면 순서, 고친 값 그대로)마다 값을 글자로 쓴
      INSERT 문 한 줄을 클립보드에 넣는다. 기본 키가 없어 편집할 수 없는 테이블에서도 된다.
      NULL은 NULL로, 글은 '…'(SQL Server N'…'), 날짜는 Oracle TO_DATE·TO_TIMESTAMP, SQL Server CAST(… AS DATETIME2).
      LOB 같은 편집할 수 없는 형식·잘려 보이는 값은 빼고 줄 끝 주석에 적는다.
  - name: WHERE 칸·다시 조회
    description: >-
      조건을 넣고 Enter나 [다시 조회]를 누르면 "SELECT * FROM 테이블 WHERE (조건)"을 빠른 조회처럼 실행한다(앞 100행, 편집 대상 다시 정함).
      앞의 WHERE 낱말은 떼고, 비우면 조건 없이 조회한다. 칸에는 그 결과를 조회한 조건이 보인다.
      저장하지 않은 추가·수정·삭제 표시가 있으면 버릴지 먼저 묻는다(기본 [취소]).
  - name: WHERE 조건 검사
    description: >-
      조건은 괄호 안에서만 실행되도록 문자열·따옴표 이름 밖의 ';'·주석(--, /*)·짝이 안 맞는 괄호·닫히지 않은 문자열을 막는다
      (괄호를 벗어난 UNION·FOR UPDATE·다른 문장 이어 붙이기 방지 — PostgreSQL·SQL Server는 한 명령에 여러 문장을 받는다).
      DB마다 해석이 달라 검사를 속일 수 있는 대괄호, 접두 문자열(q'·E'·U&' 등, N'만 허용), '$'로 시작하는 달러 인용도 막는다.
      실행은 일반 실행 경로를 거쳐 읽기 전용 접속 검사도 그대로 받는다.
  - name: 멈춤 조건
    description: >-
      오류가 나거나 영향 행 수가 1이 아니면 그 행에서 멈추고 메시지 탭에 이유를 보인다.
      이미 보낸 문장은 커밋 대기이므로 [롤백]으로 되돌릴 수 있다.
  - name: 편집 대상 정하기
    description: >-
      조회 전에 데이터 사전에서 행을 찾을 키를 골라 결과 열에 맞춘다(이름 그대로, 없으면 대소문자 무시).
      조회 뒤에 읽으면 PostgreSQL에서 결과 커서가 닫히므로 앞에서 읽는다.
      고르는 순서: 기본 키 → 모든 열이 NOT NULL인 UNIQUE 제약·고유 인덱스(열이 가장 적은 것, 같으면 이름순.
      NULL 허용·부분·식 인덱스, 꺼진 제약, LOB 같은 바인드할 수 없는 형식의 열이 든 키는 뺌) →
      Oracle 보통 테이블이면 ROWID(뷰·인덱스 구성 테이블·외부 테이블은 제외).
      PostgreSQL ctid는 UPDATE마다 바뀌고 SQL Server는 행 주소가 없어 ROWID 단계는 Oracle만.
  - name: ROWID 키(Oracle)
    description: >-
      기본 키·고유 키가 없는 Oracle 테이블은 빠른 조회 SELECT 끝에 ROWIDTOCHAR(ROWID) AS "DBH$ROWID"를 붙여 가져오고
      ("SELECT 스키마.테이블.*, …" — 별칭이 없어 WHERE 칸의 "테이블.열"도 그대로 쓴다),
      그리드에 보이기 전에 행마다 떼어 둔다(그리드·복사·찾기·INSERT 문 만들기에 보이지 않음).
      UPDATE·DELETE의 WHERE는 ROWID = :rid. 실행 기록에는 ROWID를 붙인 SELECT가 남는다.
theme:
  - part: 막대 바탕·테두리
    keys: [SurfaceBackground, BorderBrush]
  - part: 안내 글
    keys: [SecondaryText]
states:
  - 안내 글에 대상 테이블과 "수정 n · 삭제 m (저장하지 않음)" 또는 편집할 수 없는 이유를 보인다.
  - 기본 키가 아닌 키로 행을 찾으면 대상 뒤에 "(고유 키 UK_…로 행을 찾음)"·"(ROWID로 행을 찾음)"을 붙인다.
  - 키가 없으면 "기본 키나 NOT NULL 고유 키가 없어 편집할 수 없습니다."
  - 행 추가·복제·편집·삭제는 편집할 수 있고 실행 중이 아닐 때, 저장은 그에 더해 변경이 있을 때만 켜진다.
  - 안내 글에 "추가 n · 수정 m · 삭제 k (저장하지 않음)".
  - WHERE 칸은 실행 중이 아닐 때, [다시 조회]는 그에 더해 접속이 있을 때 켜진다(기본 키가 없어 편집할 수 없는 결과도 다시 조회는 된다).
  - 쓸 수 없는 조건이면 상태줄에 이유를 보이고 칸에 포커스를 둔다.
limits:
  - >-
    새 행에서 비운 열(DB 기본값·자동 번호)은 저장 뒤에도 그리드에 빈 값으로 남는다 — 실제 값은 다시 조회해야 보인다.
    키를 비운 채 저장한 새 행을 다시 고치면 키로 행을 찾지 못해 0행으로 멈춘다.
  - NULL을 일부러 넣어 DB 기본값을 덮을 수는 없다(NULL 열은 INSERT에서 빠짐).
  - >-
    기본 키·NOT NULL 고유 키가 없는 테이블·뷰(Oracle 보통 테이블은 ROWID로 편집), 결과에 키 열이 없을 때,
    읽기 전용 접속, 연결이 끊겼을 때는 버튼이 꺼진다.
  - >-
    ROWID 키: 저장한 새 행은 ROWID를 몰라 다시 조회(F1)하기 전에는 고치거나 지울 수 없다(상태줄에 이유).
    행 이동을 켠 분할 테이블에서 분할 키를 바꾸는 등 ROWID가 바뀌면 그 뒤 저장은 0행으로 멈춘다.
  - 저장 전에 원본이 다른 세션에서 바뀌었는지 보지 않는다(다른 열 변경은 덮어쓴다, 지워졌으면 0행으로 멈춤).
  - 저장하지 않은 표시는 다른 문장 실행·트리 F1 다시 조회 때 묻지 않고 사라진다(묻는 것은 WHERE 칸 [다시 조회]뿐).
  - WHERE 조건 안의 함수 호출(부작용이 있는 사용자 함수 등)은 막지 않는다 — 편집기에서 쓸 수 있는 SQL보다 넓히지 않는 것이 목표.
  - ORDER BY는 넣을 수 없다(괄호 안 조건만).
tests:
  - tests/MyPlugin.Tests/RowEditLogicTests.cs
  - tests/MyPlugin.Tests/ResultExcelTests.cs
  - tests/MyPlugin.Tests/DbSessionTests.cs
  - tests/MyPlugin.Tests/TableInfoTests.cs
related: [result-grid, row-edit-dialog, dialogs]
