id: table-info-window
name: TableInfoWindow
title: 테이블 정보 창
kind: window
source:
  - src/MyPlugin/Ui/TableInfoWindow.cs
  - src/MyPlugin/Ui/TableSchemaEditor.cs
  - src/MyPlugin/Ui/TableInfoLogic.cs
  - src/MyPlugin/Ui/TableSchemaLogic.cs
  - src/MyPlugin/Ui/SchemaRowLogic.cs
  - src/MyPlugin/Ui/IndexColumnsLogic.cs
  - src/MyPlugin/Db/TableDescription.cs
  - src/MyPlugin/Db/Schema/TableSchemaProvider.cs
  - src/MyPlugin/Db/Schema/OracleTableSchema.cs
  - src/MyPlugin/Db/Schema/PostgresTableSchema.cs
  - src/MyPlugin/Db/Schema/SqlServerTableSchema.cs
used_by: [db-tree-panel, sql-workspace]
summary: >-
  F4로 여는 테이블·뷰 정보 및 편집 창(모달 아님 — 열어 둔 채 SQL을 쓸 수 있다).
  이름·종류·통계·주석을 확인하고, 쓰기 가능한 접속의 테이블이면 컬럼·인덱스·제약 조건을 표 안에서 바로 추가·수정·삭제한 뒤
  [저장] 때 한꺼번에 검사하고 DDL로 반영한다. Oracle·PostgreSQL·SQL Server를 지원한다 — 조회와 DDL은 IDbProvider.TableSchema
  (ITableSchemaProvider·ISchemaDdl)가 DBMS별로 만들고, 화면·검증·실행 순서는 공통이다.
features:
  - name: 머리
    description: 이름·종류·행 수(통계)·날짜·주석, 접속 DB 배지.
  - name: 탭 목록
    description: >-
      왼쪽 세로 탭 [컬럼]·[인덱스]·[제약 조건]. 탭마다 행 수와 변경 수(● n, 주황) 또는 오류 수(⚠ n, 빨강)를 표시한다.
  - name: 표 안 추가·삭제
    description: >-
      표 맨 아래 [＋ 컬럼/인덱스/제약 조건 추가] 줄(또는 Insert)로 빈 행을 넣고 이름 칸 편집을 바로 시작한다.
      행 끝 [✕]로 삭제 표시(새 행은 바로 빠짐), 삭제 표시된 행은 [↶]로 취소한다(Delete 키도 같음). 삭제 행은 취소선.
  - name: 셀 편집
    description: >-
      이름·기본값·주석·참조·CHECK 조건은 글자 칸(더블클릭·F2·바로 입력).
      NOT NULL·UNIQUE·사용(제약 활성) 체크박스는 한 번 클릭으로 바뀐다. 제약 종류에 해당하지 않는 칸(외래 키가 아닌 참조 등)은 흐리게 막는다.
  - name: 상태 표시
    description: >-
      행 머리 ✚ 추가 · ✎ 수정 · ✕ 삭제 · ⚠ 오류(툴팁에 이유), 행 바탕 초록(추가)·노랑(수정)·빨강(삭제).
  - name: 코드 보기 팝업 칸
    description: >-
      자료형·제약 종류·인덱스/키 컬럼은 드롭다운 대신 CodePopup(검색 + 목록 팝업) 칸이다. 자료형은 직접 입력도 되고 목록에 없는 형식은 "그대로 쓰기",
      제약 종류는 누르면 바로 바뀐다. 컬럼 목록은 행 어디를 눌러도 체크되고 체크 순서·ASC/DESC(인덱스만)·↑↓로 정한 뒤 [확인]. 표에서 F2·F4·Alt+↓로 연다.
  - name: 복합 키
    description: >-
      컬럼 탭에서 여러 컬럼을 골라 우클릭 [선택 컬럼으로 기본 키/고유 제약/인덱스/고유 인덱스 만들기].
  - name: 저장 시 검증
    description: >-
      편집 중에는 검사하지 않는다. [저장] 때 모든 오류(빈 이름·자료형, 이름 중복, 기본 키 둘, 해석할 수 없는 컬럼 목록,
      참조·조건 누락, 삭제할 컬럼을 남은 인덱스·제약이 사용 등)를 한꺼번에 찾아 해당 칸을 빨갛게 표시하고,
      아래 오류 목록(누르면 그 칸으로 이동)에 보이며 첫 오류 칸으로 간다. 칸을 고치면 그 오류는 사라진다.
  - name: DDL 확인·실행
    description: >-
      검증을 통과하면 실행할 DDL을 실행 순서(제약 삭제 → 인덱스 삭제 → 컬럼 → 인덱스 생성 → 제약 추가 → 활성/비활성)로 보여 주고
      [SQL 복사]·[실행]을 고른다. 컬럼 삭제가 있으면 데이터 손실 경고와 확인 체크. 오류가 나면 그 문장에서 멈추고 남은 변경은 표에 그대로 둔다.
      커밋 대기 변경이 있으면 저장하지 않는다. 문장마다 성공하면 커밋된다(Oracle은 DDL 자동 커밋, PostgreSQL·SQL Server는 저장 경로가 문장마다 커밋,
      실패한 문장은 롤백) — 앞 문장이 반영된 채 멈추므로 남은 변경만 다시 저장할 수 있다.
  - name: 아래 버튼
    description: "[SELECT 문 넣기]·[빠른 조회]·[저장 (n)]·[닫기]. 표 아래 [↶ 모든 변경 취소]."
keyboard:
  - keys: Esc
    action: 닫기(셀 편집 중이면 편집 취소).
  - keys: Ctrl+S
    action: 검사 후 변경된 구조 저장(DDL 실행).
  - keys: Insert
    action: 현재 탭에 새 행 추가.
  - keys: Delete
    action: 선택 행 삭제 표시 / 삭제 취소(셀 편집 중이 아닐 때).
  - keys: Ctrl+Z
    action: 선택 행을 DB 값으로 되돌리기(셀 편집 중이 아닐 때).
theme:
  - part: 창·표
    keys: [WindowBackground, PanelBackground, SurfaceBackground, PrimaryText, SecondaryText, Accent, Border, Selection, RowHover]
  - part: 편집 행 상태
    keys: [InsertedRow, ModifiedRow, DeletedRow, Success, Warning, Danger]
states:
  - 읽기 전용(뷰·타 DBMS·읽기 전용 접속): 표만 보이고 추가 줄·행 끝 단추·우클릭 메뉴가 없다. 아래 문구로 이유를 알린다.
  - 변경 있음: 창 제목 앞 *, [저장 (n)], 아래 "변경 n건 — Ctrl+S로 저장".
  - 저장 실패(검증): 빨간 오류 목록, 칸 강조, 탭 ⚠ n.
  - 저장 중: 표를 막고 "저장 중… (i/n)".
limits:
  - 테이블 구조 편집은 쓰기 가능한 접속(Oracle·PostgreSQL·SQL Server)의 TABLE 객체에서만 동작한다(VIEW·읽기 전용 접속은 읽기 전용).
  - 특수 인덱스(Oracle BITMAP·함수 기반·DOMAIN, PostgreSQL 비 btree·부분·식·INCLUDE, SQL Server 클러스터드·필터·INCLUDE)와
    제약이 쓰는 인덱스는 컬럼·고유를 바꿀 수 없다(이름 변경·삭제만). 제약이 쓰는 인덱스는 그 제약을 함께 지워야 지울 수 있다
    (Oracle은 제약을 추가할 때 앞 컬럼이 같은 기존 인덱스를 다른 이름이어도 가져다 쓴다).
  - 제약 끄기·켜기: Oracle 모든 종류, SQL Server 외래 키·검사만, PostgreSQL 불가([사용] 칸이 막힌다).
  - 이름 최대 길이: Oracle 128, PostgreSQL 63, SQL Server 128(저장 때 검사).
  - Oracle 내림차순 인덱스는 함수 기반 인덱스가 되어 컬럼이 SYS_NC… 식으로 보이므로 다시 만들 수 없다.
  - SQL Server의 기본값 변경·컬럼 삭제·주석은 기존 기본값 제약·확장 속성을 찾아 정리하는 배치 한 개로 실행한다.
  - 자료형·기본값·CHECK 조건의 SQL 문법은 검사하지 않는다(DB 오류로 알려 준다).
verification:
  - >-
    TableSchemaIT로 실제 DB 세 종류(Oracle 12c, PostgreSQL 16, SQL Server 2022 — Docker)에서 테이블을 만들고
    조회 → 컬럼 추가·이름·기본값·NOT NULL·주석·형식 변경, 인덱스 다시 만들기·이름 변경, 고유 제약 추가, 검사 제약 삭제, 외래 키 끄기(가능한 DBMS) →
    저장(DDL 실행) → 다시 조회해 반영을 확인했다(화면을 거치지 않는 모델·DDL 경로).
  - >-
    저장 단계마다 DbSession.ExecuteDdlCommittedAsync로 커밋 대기 확인·DDL 실행·(트랜잭션 DDL이면) 커밋을 세션 잠금 한 번 안에서 한다 —
    실행과 커밋 사이에 같은 DB의 다른 탭 DML이 끼어 함께 커밋되지 않는다(DbSessionTests).
