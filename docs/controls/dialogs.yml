id: dialogs
name: Dialogs
title: 확인·안내 대화상자
kind: dialog
source:
  - src/MyPlugin/Ui/Dialogs.cs
used_by: [sql-workspace, db-helper-view, result-edit-bar, row-edit-dialog]
summary: >-
  확인·선택·안내용 모달 창 모음(Dialogs·PasswordPrompt)과 그 공통 틀(DialogKit).
  되돌릴 수 없는 선택은 경고 + 확인 체크를 거쳐야 실행 버튼이 켜지고, 기본 버튼은 가장 안전한 쪽이다.
features:
  - name: 위험한 문장 실행(ConfirmDanger)
    description: >-
      WHERE 없는 UPDATE·DELETE, DROP·TRUNCATE·ALTER 등. 접속 배지·주소, 문장, 경고, 확인 체크 뒤 [실행].
  - name: 커밋 대기 중 DDL(ConfirmDdlWithPending)
    description: >-
      DDL이 커밋 대기 변경까지 함께 커밋한다는 경고와 확인 체크. DDL이 자동 커밋하는 공급자(Oracle, IDbProvider.DdlAutoCommits)에서만 띄운다 —
      PostgreSQL·SQL Server는 DDL도 커밋 대기가 되어 함께 롤백할 수 있다.
  - name: 커밋하지 않은 변경(AskPending)
    description: >-
      끊기·창 닫기 전에 롤백(기본)·커밋을 고른다. 기본 버튼은 아무것도 하지 않는 [돌아가기].
  - name: 저장하지 않은 SQL(AskSaveChanges)
    description: 탭을 닫기 전 [저장]·[저장 안 함]·[취소]. 기본 버튼은 [취소].
  - name: 결과 편집 저장(ConfirmRowEdits)
    description: >-
      제목 "결과 편집 저장 · 접속"(본문에 배지 없음), "DELETE m행 · UPDATE n행 · INSERT k행", 보낼 문장들(바인드 값 포함, 실행 순서대로 — WHERE에 원래 값 비교 o0…),
      안내(조회 뒤 다른 세션이 바꾼 행은 충돌로 멈춤, 오류·충돌·취소면 이번 저장 전체를 되돌리고 저장 전 커밋 대기는 유지, 커밋 전까지 [롤백]).
      삭제가 있으면 경고 + 확인 체크.
  - name: 다시 조회 전 변경 버리기(ConfirmDiscardEdits)
    description: >-
      편집 막대 [다시 조회] 때 저장하지 않은 수정·삭제 표시가 있으면 [버리고 조회]·[취소]. 기본 버튼은 [취소].
  - name: 행 편집 버리기(ConfirmDiscardRowEdit)
    description: >-
      행 편집 창을 [취소]·Esc·X로 닫을 때 바꾼 칸이 있으면. 제목은 편집 창 앞머리 · 접속, "바꾼 칸이 있습니다. 버리고 닫을까요?",
      [버리고 닫기]·[계속 편집]. 기본 버튼(Enter·Esc)은 [계속 편집].
  - name: 예/아니요 확인(Confirm)
    description: >-
      글 + [동작]·[취소](기본 [취소]). danger면 위험색 글과 확인 체크. 되돌릴 일이 없는 확인은 [동작]을 기본으로 할 수 있다 — 예: SQL 실행 때 끊긴 연결 "다시 연결할까요?"(Enter = [다시 연결]).
  - name: 안내(Show)
    description: 아이콘 + 글(오류면 위험색) + [확인]. Ctrl+C로 제목·내용을 복사한다.
  - name: 비밀번호 입력(PasswordPrompt)
    description: >-
      비밀번호를 저장하지 않은 접속의 연결 때. 제목 "비밀번호 입력 · 이름", 이유 한 줄, [연결](빈 값이면 꺼짐)·[취소].
  - name: 공통 틀(DialogKit)
    description: >-
      Folderss GitDialogBase와 같은 모양을 코드로 만든다. 소유 창 가운데, 크기 고정, 작업 표시줄에 안 보임.
      제목·본문·힌트·경고·문장 상자·체크·라디오·주 동작/일반/취소 버튼·포커스 지정 도우미.
keyboard:
  - keys: Enter
    action: 기본 버튼(대개 [취소]·[돌아가기] — 잘못 눌러도 되돌릴 수 없는 일을 하지 않게).
  - keys: Esc
    action: 취소 버튼.
  - keys: Ctrl+C
    action: 안내 창의 제목·내용 복사.
theme:
  - part: 창 바탕·글자·글꼴
    keys: [WindowBackground, PrimaryText, AppFontFamily]
  - part: 문장 상자
    keys: [SurfaceBackground]
  - part: 경고 글
    keys: [Theme.Danger]
  - part: 주 동작 버튼 테두리
    keys: [AccentBrush]
  - part: 접속 배지
    keys: [Theme.DbBadge]
limits:
  - CheckBox는 Folderss 테마 스타일이 없어 글자색만 연결한다(상자는 기본 모양).
tests:
  - tests/MyPlugin.Tests/WorkspaceLogicTests.cs
related: [sql-workspace, result-edit-bar, theme]
