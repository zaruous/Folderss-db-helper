# 플러그인 빌드와 릴리스.
# - main 푸시·PR: publish해서 플러그인을 Actions 아티팩트로 올린다 (확인용 — 받은 zip을 그대로 설치)
# - v* 태그 푸시(예: v1.0.0): 태그 버전과 plugin.json의 version이 같은지 확인한 뒤 GitHub 릴리스에 zip을 첨부한다
# - 태그가 아닌 빌드는 버전 뒤에 브랜치·커밋을 붙인다(예: 1.7.0-main.fad0bb6) — 설치한 테스트 빌드를 정식 릴리스와 구분하려고.
#   CI 작업 공간의 plugin.json만 바꾸고 저장소 파일은 그대로다.
# 플러그인 폴더 이름을 바꿔도(src/<이름>/) 그대로 동작한다. src 아래 plugin.json은 하나여야 한다.
# - ui-test 작업(Windows): 헤드리스 화면 시험(tests/MyPlugin.UiTests)을 scripts/ui-test.ps1로 숨은 데스크톱에서 돌린다.
#   DB 없는 시험은 항상, 실제 Oracle 시험은 저장소 secret FMON_UI_ORACLE이 있을 때만 별도 단계로. trx·캡처는 아티팩트로 남는다.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 태그 빌드에서 릴리스를 만들기 위해 필요

jobs:
  build:
    # WPF 플러그인이지만 csproj의 EnableWindowsTargeting 덕분에 Linux에서도 컴파일된다 (실행은 Windows에서)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 플러그인 찾기
        id: plugin
        shell: bash
        # 브랜치 이름은 누구나 정할 수 있는 글이라 스크립트에 직접 넣지 않고 환경 변수로 넘긴다
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shopt -s nullglob
          manifests=(src/*/plugin.json)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::src/*/plugin.json 이 정확히 하나여야 합니다 (찾은 개수: ${#manifests[@]})"
            exit 1
          fi
          manifest="${manifests[0]}"
          dir="$(dirname "$manifest")"
          version="$(jq -r '.version // empty' "$manifest")"
          id="$(jq -r '.id // empty' "$manifest")"
          if [ -z "$id" ]; then
            echo "::error::$manifest 에 id가 없습니다"
            exit 1
          fi
          # 태그가 아니면 "버전-브랜치.커밋7자리". 브랜치의 영문·숫자·. - 밖의 글자는 -로
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            branch="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9.-' '-')"
            version="${version}-${branch}.${COMMIT:0:7}"
            jq --arg v "$version" '.version = $v' "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "플러그인: $id $version ($dir)"

      - name: 태그와 plugin.json 버전 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.plugin.outputs.version }}" ]; then
            echo "::error::태그 버전($tag)과 plugin.json version(${{ steps.plugin.outputs.version }})이 다릅니다. plugin.json을 고친 뒤 다시 태그하세요."
            exit 1
          fi

      # 지침 예제 시험(GuideExamplesTests)이 make_template.py·check_template.py를 실제로 돌린다 — 없으면 그 시험만 건너뛴다
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 지침 예제 시험 준비(openpyxl)
        run: pip install openpyxl

      - name: 테스트
        run: dotnet test tests/MyPlugin.Tests -c Release --nologo

      - name: publish
        run: dotnet publish "${{ steps.plugin.outputs.dir }}" -c Release --nologo

      - name: zip 찾기
        id: zip
        shell: bash
        run: |
          shopt -s nullglob
          zips=("${{ steps.plugin.outputs.dir }}"/bin/Release/net8.0-windows/win-x64/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::플러그인 zip을 찾지 못했습니다"
            exit 1
          fi
          # 릴리스 파일 이름: <id>-<version>.zip
          out="${{ steps.plugin.outputs.id }}-${{ steps.plugin.outputs.version }}.zip"
          cp "${zips[0]}" "$out"
          unzip -l "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # 아티팩트는 GitHub가 한 번 더 zip으로 감싼다 — zip을 그대로 올리면 받은 파일 맨 위에 plugin.json이 없어 설치되지 않는다.
      # 풀어서 내용을 올리면 받은 아티팩트 zip이 곧 플러그인 zip이다(맨 위에 plugin.json).
      - name: 아티팩트용으로 풀기
        shell: bash
        run: |
          rm -rf artifact
          unzip -q "${{ steps.zip.outputs.path }}" -d artifact
          test -f artifact/plugin.json || { echo "::error::zip 맨 위에 plugin.json이 없습니다"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plugin.outputs.id }}-${{ steps.plugin.outputs.version }}
          path: artifact/

      - name: GitHub 릴리스
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # 웹에서 [Draft a new release]로 태그를 만들면 릴리스가 이미 있다 — 그때는 zip만 그 릴리스에 올린다(같은 이름이면 바꿈)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.path }}" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # 헤드리스 WPF 화면 시험. 플러그인을 이 러너에서 publish해 그 zip을 Folderss와 같은 로드 컨텍스트로 불러 시험한다
  # (계약 어셈블리는 저장소의 contract/ 프로젝트 참조로 빌드되므로 Folderss 본체·SDK는 필요 없다).
  # scripts/ui-test.ps1은 CreateDesktop으로 만든 숨은 데스크톱에서 dotnet test를 돌린다 — 러너에서도 같은 방식이라
  # 로컬과 CI가 같은 경로를 탄다. 숨은 데스크톱을 못 만들면 스크립트가 실패하고, 시험이 숨은 데스크톱 밖에서 돌면
  # 모든 시험이 건너뛰어져 "실행 0개"로 실패한다(성공으로 보이지 않음).
  ui-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # secret은 단계 if에서 직접 못 쓰므로 있는지만 작업 환경 변수로 넘긴다(값은 실제 DB 단계에만)
      HAS_ORACLE: ${{ secrets.FMON_UI_ORACLE != '' }}
      UI_OUT: ${{ github.workspace }}\uitest-out
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Requires=Oracle 특성이 없는 시험 전부. 여기서는 건너뛴 시험이 하나도 없어야 한다(-FailOnSkip) —
      # 숨은 데스크톱·zip 같은 환경 문제로 빠지는 시험을 성공으로 넘기지 않는다.
      - name: UI 시험 (DB 없음)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ui-test.ps1 -Filter "Requires!=Oracle" -FailOnSkip -Title "UI 시험 (DB 없음)" -Work "$env:UI_OUT\db-less"

      # 실제 Oracle(결과 편집 저장·롤백 등 DB가 필요한 화면 시나리오). secret이 없으면(포크 PR 포함) 이 단계는 돌지 않고 아래 알림만 남는다.
      # FMON_UI_ORACLE = host:port/service (러너에서 닿는 DB여야 함), FMON_UI_ORACLE_USER·FMON_UI_ORACLE_PW는 없으면 시험 기본값.
      # 실제 DB가 있을 때는 모든 시험을 그 접속과 함께 다시 돌리고, 하나라도 건너뛰면 실패.
      - name: UI 시험 (실제 Oracle)
        if: ${{ !cancelled() && env.HAS_ORACLE == 'true' }}
        shell: pwsh
        env:
          FMON_UI_ORACLE: ${{ secrets.FMON_UI_ORACLE }}
          FMON_UI_ORACLE_USER: ${{ secrets.FMON_UI_ORACLE_USER }}
          FMON_UI_ORACLE_PW: ${{ secrets.FMON_UI_ORACLE_PW }}
        run: |
          # 빈 값이면 지워서 시험의 기본 계정을 쓰게 한다
          foreach ($name in 'FMON_UI_ORACLE_USER', 'FMON_UI_ORACLE_PW') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
          }
          pwsh -NoProfile -File scripts/ui-test.ps1 -NoPublish -FailOnSkip -Title "UI 시험 (실제 Oracle)" -Work "$env:UI_OUT\oracle"

      - name: 실제 Oracle UI 시험 건너뜀 알림
        if: ${{ env.HAS_ORACLE != 'true' }}
        shell: pwsh
        run: |
          $msg = '실제 Oracle UI 시험(Requires=Oracle)은 secret FMON_UI_ORACLE이 없어 돌리지 않았습니다 — DB 없는 시험만 검증됨.'
          Write-Host "::notice title=UI 시험::$msg"
          "### UI 시험 (실제 Oracle)`n- :warning: $msg`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # trx·실행 기록·캡처(shots)만 올린다 — 풀어 놓은 플러그인·plugin-data(접속 정보)는 올리지 않는다
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-test-results
          path: |
            uitest-out/*/results/
            uitest-out/*/*.log
            uitest-out/*/*.png
            uitest-out/*/run-*/shots/
          if-no-files-found: warn
          retention-days: 14
